# Production deployment: pulls pre-built Docker Hub images only.
# Run with: docker compose --env-file .env.production -f compose.production.yml up -d
services:
  backend:
    image: ${BACKEND_IMAGE:-hoangquang153636/backend}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: flowchat-production-backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      # The container listens on 5000; production exposes it as host port 5001.
      PORT: "5000"
      CLIENT_URL: ${FLOWCHAT_PUBLIC_URL:?Set FLOWCHAT_PUBLIC_URL in .env.production}
      APP_PUBLIC_URL: ${FLOWCHAT_PUBLIC_URL:?Set FLOWCHAT_PUBLIC_URL in .env.production}
    ports:
      - "5001:5000"
    networks:
      - flowchat-production-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/api/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ${FRONTEND_IMAGE:-hoangquang153636/frontend}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: flowchat-production-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8083:80"
    networks:
      - flowchat-production-network

networks:
  flowchat-production-network:
    driver: bridge
